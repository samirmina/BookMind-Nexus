# =============================================================================
# BookMind Nexus - Docker Profile
# =============================================================================
# Activated via SPRING_PROFILES_ACTIVE=docker (see docker-compose.yml).
# All values are sourced from environment variables via ${VAR:default} placeholders.
# =============================================================================

# --- Server ---
server.port=${SERVER_PORT:8083}
server.address=0.0.0.0
server.servlet.session.timeout=${SESSION_TIMEOUT_SECONDS:1800}
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.same-site=Strict
server.servlet.session.tracking-modes=cookie
server.use-forward-headers=true
server.forward-headers-strategy=${FORWARD_HEADERS_STRATEGY:native}

# --- Rate limiting ---
rate.limit.trust-forwarded=${RATE_LIMIT_TRUST_FORWARDED:false}

# --- Multipart / Upload limits ---
spring.servlet.multipart.max-file-size=${MAX_FILE_SIZE:50MB}
spring.servlet.multipart.max-request-size=${MAX_REQUEST_SIZE:50MB}

# --- Spring Security / Actuator ---
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never

# --- Database (PostgreSQL 16 + pgvector) ---
spring.datasource.url=${DB_URL:jdbc:postgresql://postgres:5432/${DB_NAME:book_assistant}}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.sql.init.schema-locations=classpath:schema-migration.sql/V1__initial_schema.sql
spring.sql.init.mode=never
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# --- Encryption (REQUIRED for OAuth token at-rest encryption) ---
# Set APP_ENCRYPTION_KEY to a base64-encoded 256-bit key before deployment.
app.encryption-key=${APP_ENCRYPTION_KEY:}

# --- AI Configuration ---
app.ai.base-url=${AI_BASE_URL:http://ollama:11434/api/generate}
app.ai.model=${AI_MODEL:phi3.5:latest}
app.ai.embedding-model=${AI_EMBEDDING_MODEL:nomic-embed-text}
app.ai.api-key=${OLLAMA_API_KEY:}
app.ai.timeout-seconds=${AI_TIMEOUT_SECONDS:120}
app.ai.num-predict=${AI_NUM_PREDICT:1024}
app.ai.num-ctx=${AI_NUM_CTX:16384}
app.ai.num-gpu=${AI_NUM_GPU:100}
app.ai.temperature=${AI_TEMPERATURE:0.2}
app.ai.top-p=${AI_TOP_P:0.9}
app.ai.top-k=${AI_TOP_K:40}
app.ai.repeat-penalty=${AI_REPEAT_PENALTY:1.1}
app.ai.presence-penalty=${AI_PRESENCE_PENALTY:0.0}
app.ai.frequency-penalty=${AI_FREQUENCY_PENALTY:0.0}
app.ai.max-predict-scale=${AI_MAX_PREDICT_SCALE:3}
app.ai.think=${AI_THINK:false}

# --- Pages summary mode ---
app.summary.pages-mode=${SUMMARY_PAGES_MODE:aisummary}

# --- Extraction mode ---
app.extraction.mode=${EXTRACTION_MODE:pix2text}
app.extraction.pix2text.url=${PIX2TEXT_URL:http://pix2text:8080}
app.extraction.pix2text.timeout=${PIX2TEXT_TIMEOUT:600s}

# --- Directory paths ---
app.cache-dir=${APP_CACHE_DIR:/app/cache}
app.logs-dir=${APP_LOGS_DIR:/app/logs}
app.upload-dir=${APP_UPLOAD_DIR:/app/tmp}
app.storage-dir=${APP_STORAGE_DIR:/app/storage/books}
app.screenshots-dir=${APP_SCREENSHOTS_DIR:/app/ui-screenshots}
app.pdf-source-dir=${APP_PDF_SOURCE_DIR:/app/external/pdfs}
