# =============================================================================
# BookMind Nexus - Local Development Profile
# =============================================================================
# Overrides for local development. Database configuration is intentionally
# omitted and will be supplied through environment variables at deployment time.

# --- Server ---
server.port=8083

# --- Database (H2 for local development) ---
spring.datasource.url=jdbc:h2:mem:book_assistant;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.sql.init.continue-on-error=true

# --- AI Configuration (local Ollama) ---
app.ai.base-url=http://localhost:11434/api/generate
app.ai.model=deepseek-r1:7b
app.ai.embedding-model=nomic-embed-text
app.ai.api-key=${OLLAMA_API_KEY:}
app.ai.timeout-seconds=120
app.ai.num-predict=1024
app.ai.num-ctx=4096
app.ai.temperature=0.2
app.ai.top-p=0.9
app.ai.top-k=40
app.ai.repeat-penalty=1.1
app.ai.presence-penalty=0.0
app.ai.frequency-penalty=0.0
app.ai.max-predict-scale=4
app.ai.think=false

# --- Pages summary mode ---
app.summary.pages-mode=aisummary

# --- Extraction mode (local Pix2Text) ---
app.extraction.mode=pix2text
app.extraction.pix2text.url=http://localhost:8080
app.extraction.pix2text.timeout=600s

# --- Directory paths ---
app.cache-dir=cache
app.logs-dir=logs
app.upload-dir=tmp
app.storage-dir=storage/books
app.screenshots-dir=ui-screenshots
app.pdf-source-dir=external/pdfs

# --- Logging ---
logging.level.root=WARN
logging.level.com.bookassistant=INFO
logging.level.org.springframework.web=WARN
logging.level.org.apache.catalina=WARN
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] [%X{correlationId}] %-5level %logger{36} - %msg%n
logging.file.name=logs/book-assistant.log
logging.file.max-size=10MB
logging.file.max-history=30

# --- Encryption key for local testing (32 bytes / 256 bits, base64-encoded) ---
app.encryption-key=AAECAwQFBgcICQoLDA0ODxAREhMUFRYXGBkaGxwdHh8=
