# =============================================================================
# BookMind Nexus - Default Application Configuration
# =============================================================================
# All values can be overridden via environment variables or command-line args.
# Database configuration is intentionally omitted here and will be supplied
# through environment-specific profiles at deployment time.

# --- Server ---
server.port=8083
server.servlet.session.timeout=1800
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=Strict
server.servlet.session.tracking-modes=cookie
server.use-forward-headers=true
server.forward-headers-strategy=native

# Rate limiting: do not trust X-Forwarded-For/X-Real-IP unless behind a trusted proxy.
rate.limit.trust-forwarded=false

# --- Multipart / Upload limits ---
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# --- Spring Security ---
# Actuator is restricted to authenticated users in SecurityConfig.
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never

# --- Encryption (REQUIRED for OAuth token at-rest encryption) ---
# Set APP_ENCRYPTION_KEY to a base64-encoded 256-bit key before deployment.
app.encryption-key=${APP_ENCRYPTION_KEY:}

# --- AI Configuration ---
app.ai.base-url=http://localhost:11434/api/generate
app.ai.model=phi3.5:latest
app.ai.embedding-model=nomic-embed-text
app.ai.api-key=${OLLAMA_API_KEY:}
app.ai.timeout-seconds=120

# --- Directory paths ---
app.cache-dir=cache
app.logs-dir=logs
app.upload-dir=tmp
app.storage-dir=storage/books
app.screenshots-dir=ui-screenshots
app.pdf-source-dir=external/pdfs
