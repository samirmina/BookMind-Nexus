<!DOCTYPE html>
<html lang="en" dir="ltr" xmlns:th="http://www.thymeleaf.org"
      th:lang="${langAttr}" th:dir="${dirAttr}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="#{home.title}"></title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/styles.css}">
</head>
<body>
    <!-- Navbar -->
    <nav class="navbar">
        <div class="navbar-inner">
            <a href="/" class="brand">
                <span class="brand-icon">🧠</span>
                <span th:text="#{home.brand}"></span>
            </a>
            <div class="nav-links">
                <a href="#features" class="nav-link" th:text="#{home.features}"></a>
                <a href="#how-it-works" class="nav-link" th:text="#{home.howItWorks}"></a>
                <a href="/contact" class="nav-link" th:text="#{home.contact}"></a>
                <a th:if="${session.userId == null}" href="/login" class="nav-cta" th:text="#{navbar.login}"></a>
                <a th:if="${session.userId == null}" href="/register" class="nav-cta-secondary" th:text="#{register.title}"></a>
                <a th:if="${session.userId != null}" href="/app" class="nav-cta" th:text="#{navbar.app}"></a>
                <a th:if="${session.userId != null}" href="/outputs" class="nav-cta-secondary">📋 <span th:text="#{navbar.outputs}"></span></a>
                <form th:if="${session.userId != null}" th:action="@{/logout}" method="post" class="d-inline">
                    <button class="nav-cta-secondary" type="submit" th:text="#{navbar.logout}"></button>
                </form>
                <select class="form-select form-select-sm lang-switch" onchange="if(this.value)window.location.href='/language/switch?lang='+this.value+'&redirect=/'">
                        <option value="" th:text="#{navbar.language}"></option>
                        <option value="ar" th:text="#{lang.ar}"></option>
                        <option value="en" th:text="#{lang.en}"></option>
                        <option value="es" th:text="#{lang.es}"></option>
                        <option value="es-MX" th:text="#{lang.es-MX}"></option>
                        <option value="fr" th:text="#{lang.fr}"></option>
                        <option value="de" th:text="#{lang.de}"></option>
                        <option value="de-AT" th:text="#{lang.de-AT}"></option>
                        <option value="it" th:text="#{lang.it}"></option>
                        <option value="nl" th:text="#{lang.nl}"></option>
                        <option value="pt" th:text="#{lang.pt}"></option>
                        <option value="ru" th:text="#{lang.ru}"></option>
                        <option value="uk" th:text="#{lang.uk}"></option>
                        <option value="af" th:text="#{lang.af}"></option>
                        <option value="zh" th:text="#{lang.zh}"></option>
                        <option value="ja" th:text="#{lang.ja}"></option>
                </select>
            </div>
        </div>
    </nav>

    <!-- Hero -->
    <section class="hero">
        <div class="hero-ar" th:if="${uiLanguage == 'ar'}" th:text="#{home.hero.ar}"></div>
        <div class="hero-en" th:if="${uiLanguage != 'ar'}" th:text="#{home.hero.en}"></div>
        <h1 class="hero-title" th:text="#{home.hero.title}"></h1>
        <div class="hero-actions">
            <a th:if="${session.userId == null}" href="/login" class="btn-primary-hero" th:text="#{home.hero.cta}"></a>
            <a th:if="${session.userId != null}" href="/app" class="btn-primary-hero" th:text="#{home.hero.cta}"></a>
            <a href="#how-it-works" class="btn-secondary-hero" th:text="#{home.hero.learnMore}"></a>
        </div>
    </section>

    <!-- Features -->
    <section class="section" id="features">
        <div class="section-inner">
            <h2 class="section-title" th:text="#{home.features.title}"></h2>
            <div class="features-grid">
                <div class="feature-card">
                    <span class="feature-icon">💬</span>
                    <h3 th:text="#{home.features.ask}"></h3>
                    <p th:text="#{home.features.ask.desc}"></p>
                </div>
                <div class="feature-card">
                    <span class="feature-icon">📊</span>
                    <h3 th:text="#{home.features.insights}"></h3>
                    <p th:text="#{home.features.insights.desc}"></p>
                </div>
                <div class="feature-card">
                    <span class="feature-icon">🧪</span>
                    <h3 th:text="#{home.features.lab}"></h3>
                    <p th:text="#{home.features.lab.desc}"></p>
                </div>
                <div class="feature-card">
                    <span class="feature-icon">🔗</span>
                    <h3 th:text="#{home.features.sync}"></h3>
                    <p th:text="#{home.features.sync.desc}"></p>
                </div>
                <div class="feature-card">
                    <span class="feature-icon">🧩</span>
                    <h3 th:text="#{home.features.images}"></h3>
                    <p th:text="#{home.features.images.desc}"></p>
                </div>
                <div class="feature-card">
                    <span class="feature-icon">🌐</span>
                    <h3 th:text="#{home.features.bilingual}"></h3>
                    <p th:text="#{home.features.bilingual.desc}"></p>
                </div>
            </div>
        </div>
    </section>

    <!-- How It Works -->
    <section class="section how-it-works-section" id="how-it-works">
        <div class="section-inner">
            <h2 class="section-title" th:text="#{home.howItWorks.title}"></h2>
            <div class="steps-grid">
                <div class="step">
                    <div class="step-num">1</div>
                    <h4 th:text="#{home.step1.title}"></h4>
                    <p th:text="#{home.step1.desc}"></p>
                </div>
                <div class="step">
                    <div class="step-num">2</div>
                    <h4 th:text="#{home.step2.title}"></h4>
                    <p th:text="#{home.step2.desc}"></p>
                </div>
                <div class="step">
                    <div class="step-num">3</div>
                    <h4 th:text="#{home.step3.title}"></h4>
                    <p th:text="#{home.step3.desc}"></p>
                </div>
                <div class="step">
                    <div class="step-num">4</div>
                    <h4 th:text="#{home.step4.title}"></h4>
                    <p th:text="#{home.step4.desc}"></p>
                </div>
            </div>
        </div>
    </section>

<footer class="footer-custom">
        <p class="mb-1">🧠 <span th:text="#{home.brand}"></span> — <span th:text="#{about.description}"></span></p>
        <p class="mb-1">
            <a href="/contact" th:text="#{home.contact}"></a> · 
            <a href="/about" th:text="#{about.title}"></a> · 
            <a th:if="${session.userId == null}" href="/login" th:text="#{navbar.login}"></a> · 
            <a th:if="${session.userId == null}" href="/register" th:text="#{register.title}"></a> · 
                <a th:if="${session.userId != null}" href="/app" th:text="#{navbar.app}"></a> · 
                <a th:if="${session.userId != null}" href="/outputs" th:text="#{navbar.outputs}"></a> · 
                <form th:if="${session.userId != null}" th:action="@{/logout}" method="post" class="d-inline">
                    <button type="submit" class="logout-btn-inline" th:text="#{navbar.logout}"></button>
                </form>
        </p>
    </footer>
    <script src="/js/ui-audit.js" defer></script>
</body>
</html>
