<!DOCTYPE html>
<html lang="en" dir="ltr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Console Output - BookMind Nexus</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/styles.css}">
</head>
<body>
    <div class="console-container">
        <div class="console-header d-flex justify-content-between align-items-center">
            <div>
                <h1>🖥️ Console Output</h1>
                <p class="text-muted small mb-0">Real-time capture of application console output</p>
            </div>
            <div>
                <a href="/app" class="btn btn-outline-nova btn-sm">← Back to App</a>
            </div>
        </div>

        <div class="row g-2 mb-3">
            <div class="col-md-3">
                <div class="stats-card stats-error">
                    <div class="count" th:text="${errorCount}">0</div>
                    <div class="label">Errors</div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="stats-card stats-warn">
                    <div class="count" th:text="${warnCount}">0</div>
                    <div class="label">Warnings</div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="stats-card stats-info">
                    <div class="count" th:text="${infoCount}">0</div>
                    <div class="label">Info</div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="stats-card">
                    <div class="count" th:text="${totalEntries}">0</div>
                    <div class="label">Total Entries</div>
                </div>
            </div>
        </div>

        <div class="filters">
            <form method="get" action="/admin/console" class="row g-2 align-items-end">
                <div class="col-auto">
                    <label class="form-label small text-muted">Filter by Level</label>
                    <select name="level" class="form-select form-select-sm form-select-admin">
                        <option value="">All Levels</option>
                        <option value="ERROR" th:selected="${selectedLevel == 'ERROR'}">ERROR</option>
                        <option value="WARN" th:selected="${selectedLevel == 'WARN'}">WARN</option>
                        <option value="INFO" th:selected="${selectedLevel == 'INFO'}">INFO</option>
                        <option value="DEBUG" th:selected="${selectedLevel == 'DEBUG'}">DEBUG</option>
                    </select>
                </div>
                <div class="col-auto">
                    <button class="btn btn-nova btn-sm" type="submit">Filter</button>
                </div>
                <div class="col-auto">
                    <a href="/admin/console" class="btn btn-outline-nova btn-sm">Clear</a>
                </div>
            </form>
        </div>

        <div th:if="${entries.empty}">
            <div class="alert alert-info">No console entries captured yet.</div>
        </div>

        <div th:each="entry : ${entries}">
            <div class="console-entry">
                <div>
                    <span class="entry-level" th:classappend="'level-' + ${entry.level}" th:text="${entry.level}">INFO</span>
                    <span class="entry-time" th:text="${#temporals.format(entry.occurredAt, 'yyyy-MM-dd HH:mm:ss')}">2026-01-01 00:00:00</span>
                    <span class="entry-source" th:text="${entry.source}">STDOUT</span>
                </div>
                <div class="entry-message" th:text="${entry.message}"></div>
            </div>
        </div>

        <nav th:if="${entries.size() >= 100}" aria-label="Page navigation">
            <ul class="pagination justify-content-center">
                <li class="page-item">
                    <a class="page-link" th:href="@{/admin/console(page=${currentPage - 1})}">Previous</a>
                </li>
                <li class="page-item active">
                    <a class="page-link" th:href="@{/admin/console(page=${currentPage})}" th:text="${currentPage + 1}">1</a>
                </li>
                <li class="page-item">
                    <a class="page-link" th:href="@{/admin/console(page=${currentPage + 1})}">Next</a>
                </li>
            </ul>
        </nav>
    </div>
</body>
</html>
