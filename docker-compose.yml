# =============================================================================
# BookMind Nexus - Docker Compose Orchestration
# =============================================================================
# Services:
#   book-mind-nexus  - Main web application (port 8083)
#   ai-gateway       - AI microservice (port 8081)
#   ollama           - Local LLM inference (port 11434)
#   pix2text         - PDF text extraction microservice (port 8080)
#   postgres         - PostgreSQL 16 + pgvector (PLACEHOLDER - finalized at end)
#
# Copy .env.example to .env and fill in real values before running:
#   cp .env.example .env
#   docker compose up --build
# =============================================================================

services:
  # ---------------------------------------------------------------
  # Main web application
  # ---------------------------------------------------------------
  book-mind-nexus:
    build:
      context: .
      dockerfile: book-mind-nexus/Dockerfile
    container_name: book-mind-nexus
    ports:
      - "${SERVER_PORT:8083}:8083"
    env_file:
      - .env
    environment:
      - SPRING_PROFILES_ACTIVE=docker
    depends_on:
      ai-gateway:
        condition: service_healthy
      ollama:
        condition: service_healthy
      pix2text:
        condition: service_healthy
    volumes:
      - app_cache:/app/cache
      - app_logs:/app/logs
      - app_tmp:/app/tmp
      - app_storage:/app/storage/books
      - app_pdfs:/app/external/pdfs
    networks:
      - bookmind-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "sh", "-c", "curl -sf http://localhost:8083/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # ---------------------------------------------------------------
  # AI Gateway microservice
  # ---------------------------------------------------------------
  ai-gateway:
    build:
      context: .
      dockerfile: ai-gateway/Dockerfile
    container_name: ai-gateway
    ports:
      - "8081:8081"
    env_file:
      - .env
    environment:
      - SPRING_PROFILES_ACTIVE=docker
    depends_on:
      ollama:
        condition: service_healthy
    volumes:
      - gateway_logs:/app/logs
      - gateway_cache:/app/cache
    networks:
      - bookmind-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "sh", "-c", "curl -sf http://localhost:8081/api/gateway/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # ---------------------------------------------------------------
  # Ollama - local LLM inference
  # ---------------------------------------------------------------
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_models:/root/.ollama
    networks:
      - bookmind-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:11434/api/tags"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  # ---------------------------------------------------------------
  # Pix2Text - PDF text extraction microservice
  # ---------------------------------------------------------------
  pix2text:
    image: pix2text/pix2text:latest
    container_name: pix2text
    ports:
      - "8080:8080"
    volumes:
      - pix2text_cache:/app/cache
    networks:
      - bookmind-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "sh", "-c", "curl -sf http://localhost:8080/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

