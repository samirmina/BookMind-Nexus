# ---------------------------------------------------------------
# Networks
# ---------------------------------------------------------------
networks:
  bookmind-net:
    driver: bridge

# ---------------------------------------------------------------
# Volumes
# ---------------------------------------------------------------
volumes:
  app_cache:
  app_logs:
  app_tmp:
  app_storage:
  app_pdfs:
  gateway_logs:
  gateway_cache:
  ollama_models:
  pix2text_cache:
