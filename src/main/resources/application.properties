spring.application.name=book-assistant-lite

# File upload settings
spring.servlet.multipart.max-file-size=200MB
spring.servlet.multipart.max-request-size=200MB
spring.servlet.multipart.enabled=true
spring.servlet.multipart.resolve-lazily=true

# Server port with default value
server.port=${SERVER_PORT:8083}
server.tomcat.connection-timeout=86400000

# Async request timeout: must exceed longest expected backend operation
spring.mvc.async.request-timeout=-1

# Session timeout: 30 minutes
server.servlet.session.timeout=30m

# Project-local directories
app.project-dir=${user.dir}
app.cache-dir=/mnt/d/book-assistant-lite/external/cache
app.upload-dir=/mnt/d/book-assistant-lite/external/tmp
app.storage-dir=/mnt/d/book-assistant-lite/storage/books
app.screenshots-dir=/mnt/d/book-assistant-lite/ui-screenshots
app.logs-dir=/mnt/d/book-assistant-lite/external/logs
app.pdf-source-dir=/mnt/d/book-assistant-lite/external/pdfs

# Ollama API endpoint (local)
app.ai.base-url=${AI_BASE_URL:http://localhost:11434/api/generate}
app.ai.model=${AI_MODEL:llama3.2:3b}
app.ai.embedding-model=${AI_EMBEDDING_MODEL:nomic-embed-text}
app.ai.api-key=${AI_API_KEY:}
app.ai.timeout-seconds=${AI_TIMEOUT_SECONDS:86400}
app.ai.num-predict=${AI_NUM_PREDICT:1024}
app.ai.num-ctx=${AI_NUM_CTX:16384}
app.ai.num-gpu=${AI_NUM_GPU:100}
app.ai.temperature=${AI_TEMPERATURE:0.2}
app.ai.top-p=${AI_TOP_P:0.9}
app.ai.top-k=${AI_TOP_K:40}
app.ai.repeat-penalty=${AI_REPEAT_PENALTY:1.1}
app.ai.presence-penalty=${AI_PRESENCE_PENALTY:0.0}
app.ai.frequency-penalty=${AI_FREQUENCY_PENALTY:0.0}
app.ai.max-predict-scale=${AI_MAX_PREDICT_SCALE:4}
app.ai.think=${AI_THINK:false}

# Pages summary mode: "fulltext" returns raw extracted text, "aisummary" uses AI
app.summary.pages-mode=${SUMMARY_PAGES_MODE:aisummary}

# Extraction mode: "text-layer" uses PDFBox only, "pix2text" uses Pix2Text OCR
app.extraction.mode=pix2text
app.extraction.pix2text.url=${PIX2TEXT_URL:http://localhost:8080}
app.extraction.pix2text.timeout=${PIX2TEXT_TIMEOUT:86400s}

# Database - PostgreSQL (fresh database: book_assistant)
spring.datasource.url=jdbc:postgresql://localhost:5432/book_assistant
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=3600000
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Run schema.sql on startup for fresh database setup
spring.sql.init.mode=always
spring.sql.init.continue-on-error=true

# Thymeleaf development settings
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=file:src/main/resources/templates/
spring.thymeleaf.suffix=.html
logging.level.root=WARN
logging.level.com.bookassistant=INFO
logging.level.org.springframework.web=WARN
logging.level.org.apache.catalina=WARN
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] [%X{correlationId}] %-5level %logger{36} - %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] [%X{correlationId}] %-5level %logger{36} - %msg%n
logging.file.name=/mnt/d/book-assistant-lite/external/logs/book-assistant.log
logging.file.max-size=10MB
logging.file.max-history=30

# OAuth 2.0 Configuration
app.oauth.notion.client-id=${NOTION_OAUTH_CLIENT_ID:}
app.oauth.notion.client-secret=${NOTION_OAUTH_CLIENT_SECRET:}
app.oauth.notion.redirect-uri=${NOTION_OAUTH_REDIRECT_URI:http://localhost:8083/oauth2/callback/notion}
