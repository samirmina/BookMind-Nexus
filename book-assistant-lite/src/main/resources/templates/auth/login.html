<!DOCTYPE html>
<html lang="en" dir="ltr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="#{login.title.page}"></title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/styles.css}">
</head>
<body>
    <nav class="navbar">
        <div class="navbar-inner">
            <a href="/" class="brand">
                <span class="brand-icon">🧠</span>
                <span th:text="#{home.brand}"></span>
            </a>
            <div class="nav-links">
            <a href="/" class="nav-link" th:text="#{navbar.home}"></a>
            <a href="/about" class="nav-link" th:text="#{navbar.about}"></a>
            <a href="/contact" class="nav-link" th:text="#{navbar.contact}"></a>
            <a href="/login" class="nav-cta active" th:text="#{navbar.login}"></a>
            <a href="/register" class="nav-cta-secondary" th:text="#{register.title}"></a>
                <select class="form-select form-select-sm lang-switch" onchange="if(this.value)window.location.href='/language/switch?lang='+this.value+'&redirect=/login'">
                        <option value="" th:text="#{navbar.language}"></option>
                        <option value="ar" th:text="#{lang.ar}"></option>
                        <option value="en" th:text="#{lang.en}"></option>
                        <option value="es" th:text="#{lang.es}"></option>
                        <option value="es-MX" th:text="#{lang.es-MX}"></option>
                        <option value="fr" th:text="#{lang.fr}"></option>
                        <option value="de" th:text="#{lang.de}"></option>
                        <option value="de-AT" th:text="#{lang.de-AT}"></option>
                        <option value="it" th:text="#{lang.it}"></option>
                        <option value="nl" th:text="#{lang.nl}"></option>
                        <option value="pt" th:text="#{lang.pt}"></option>
                        <option value="ru" th:text="#{lang.ru}"></option>
                        <option value="uk" th:text="#{lang.uk}"></option>
                        <option value="af" th:text="#{lang.af}"></option>
                        <option value="zh" th:text="#{lang.zh}"></option>
                        <option value="ja" th:text="#{lang.ja}"></option>
                </select>
            </div>
        </div>
    </nav>
    <div class="container auth-container">
                <div class="text-center mb-4">
                    <a href="/" class="auth-brand">
                        <span class="auth-brand-icon">🧠</span>
                        <h4 class="auth-brand-title" th:text="#{home.brand}"></h4>
                    </a>
                </div>
        <div class="auth-card">
            <div class="card-header text-center border-0 bg-transparent pt-0">
            <h3 th:text="#{login.title}"></h3>
            <p class="text-muted small" th:text="#{login.welcome}"></p>
            </div>
            <div class="card-body">
                <div th:if="${error}" class="alert alert-error">⚠️ <span th:text="${error}"></span></div>
                <div th:if="${success}" class="alert alert-success">✅ <span th:text="${success}"></span></div>

                <form method="POST" action="/login">
                    <div class="mb-3">
                        <label class="form-label" th:text="#{login.email}"></label>
                        <input type="email" class="form-control" name="email" required th:placeholder="#{login.email}"></div>
                    <div class="mb-3">
                        <label class="form-label" th:text="#{login.password}"></label>
                        <input type="password" class="form-control" name="password" required th:placeholder="#{login.password}"></div>
                    <button type="submit" class="btn btn-nova" th:text="#{login.submit}"></button>
                </form>

                <div class="mt-3 text-center">
                    <span class="text-muted" th:text="#{login.noAccount}"></span>
                    <a href="/register" class="auth-link" th:text="#{login.registerLink}"></a>
                </div>
            </div>
        </div>
    </div>
    <script src="/js/ui-audit.js" defer></script>
</body>
</html>
