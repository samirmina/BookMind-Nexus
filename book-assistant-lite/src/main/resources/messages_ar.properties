about.ragTitle=How RAG Works
about.ragText=RAG doesn't need a smart model or local model to function. RAG is a system of three essential components: Chunking: Dividing documents into smaller pieces; Embedding: Converting these pieces into vectors; and Vector Database: Storing these vectors for quick searching. The smart model (whether local or cloud-based) only comes later. It utilizes RAG, but it doesn't necessarily have to be the one that creates it.
